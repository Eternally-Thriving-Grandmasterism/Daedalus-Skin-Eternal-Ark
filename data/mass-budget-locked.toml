# DSA-Ref-A locked mass & cruise numbers — machine-readable mirror
#
# Status: transcription only. This file introduces NO new numbers.
# Every value here already appears in the prose documents named in `source`.
# Proof Ladder: design / systems-engineering posture. Nothing here is measured
# data, and encoding a number in TOML does not raise its tier.
#
# Rule: every quantity carries an explicit `unit`. Tests enforce this.
# Contact: info@Rathor.ai

schema_version = 1
reference_design = "DSA-Ref-A"
authority = "Ra-Thor + Permanent PATSAGi Councils under TOLC 8"
proof_tier = "design / systems-engineering (not measured)"

source_documents = [
  "docs/CURRENT-BASELINE-SUMMARY.md",
  "docs/OPEN-WORK.md",
  "docs/interfaces/01-mass-budget-propulsion-interface.md",
  "docs/adr/0003-15kt-seed-lunar-loft-005c-gate.md",
  "manufacturing/reference-seed-mass-budget.md",
]

[constants]

[constants.speed_of_light]
value = 299792458.0
unit = "m/s"
source = "CODATA defined value"

[constants.tonne_per_kilotonne]
value = 1000.0
unit = "t/kt"
source = "SI prefix"

# ---------------------------------------------------------------------------
# Quantities. `kind` is either "point" (has `value`) or "band" (has `min`/`max`).
# ---------------------------------------------------------------------------

[quantities]

[quantities.collaboration_seed_dry_mass]
kind = "point"
value = 15.0
unit = "kt"
status = "target"
disclosure = "public"
source = "docs/adr/0003-15kt-seed-lunar-loft-005c-gate.md"
note = "A target inside the dry-mass band, not a measurement and not a new lock."

[quantities.dry_mass_band]
kind = "band"
min = 12.4
max = 20.15
unit = "kt"
status = "locked"
disclosure = "public"
source = "manufacturing/reference-seed-mass-budget.md"

[quantities.dry_mass_planning_center]
kind = "band"
min = 15.5
max = 16.5
unit = "kt"
status = "planning"
disclosure = "public"
