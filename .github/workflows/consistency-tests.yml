name: consistency-tests

# Repository self-consistency only. This workflow runs no FEA, no radiation
# transport, and no physics solver. A green check here means the locked numbers
# still agree with each other, not that any of them has been validated.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run stdlib unittest suite
        run: python -m unittest discover -s tests -t . -v

      - name: Realism lint
        run: python -m tools.realism_lint

      - name: Record that no physics solver is present
        run: python -m tools.solver_probe

      - name: HF-01 Pass A closed-form arithmetic (not FEA, does not close the gate)
        run: python -m tools.hf01_pass_a_toy
